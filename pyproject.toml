[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexarium-backend"
version = "0.1.0"
description = "VEXARIUM — Trading signal and options analysis tool backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "alpaca-py>=0.20",
    "pandas>=2.2",
    "pandas-ta-remake>=1.0.0",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cachetools>=5.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]